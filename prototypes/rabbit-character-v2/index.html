<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, follow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rabbit character set — study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #22202a; background: #fff; font: 16px/1.6 system-ui, sans-serif; }
    header, main { max-width: 1200px; margin: auto; padding: 24px; }
    h1, h2 { font-family: Georgia, serif; font-weight: 400; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: .25em; }
    .notice { color: #625c70; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; border: 1px solid #e2dfeb; border-radius: 12px; padding: 16px; overflow: hidden; }
    figure.night { background: #17151d; color: #f4f0fa; border-color: #494354; }
    figcaption { font-weight: 600; margin-bottom: 12px; }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>Rabbit character set</h1><p class="notice">Design studies, not production assets. Transparency and small-control legibility need refinement.</p></header>
  <main>
    <section><h2>Timeline and content</h2><div class="pair"><figure><figcaption>Day</figcaption><img src="content-day.png" alt="Daytime rabbits writing, teaching, photographing, reading and handling content"></figure><figure class="night"><figcaption>Night</figcaption><img src="content-night.png" alt="Sleepy rabbits performing the same content activities"></figure></div></section>
    <section><h2>Navigation</h2><div class="pair"><figure><figcaption>Day</figcaption><img src="navigation-day.png" alt="Daytime navigation and timeline rabbit studies"></figure><figure class="night"><figcaption>Night</figcaption><img src="navigation-night.png" alt="Sleepy navigation and timeline rabbit studies"></figure></div></section>
    <section><h2>Code</h2><div class="pair"><figure><figcaption>Day</figcaption><img src="code-day.png" alt="Daytime code and document control studies"></figure><figure class="night"><figcaption>Night</figcaption><img src="code-night.png" alt="Sleepy code and document control studies"></figure></div></section>
    <section><h2>Callouts</h2><div class="pair"><figure><figcaption>Day</figcaption><img src="callouts-day.png" alt="Daytime callout studies"></figure><figure class="night"><figcaption>Night</figcaption><img src="callouts-night.png" alt="Sleepy callout studies"></figure></div></section>
  </main>
</body>
</html>
